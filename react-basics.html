<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Basics</title>
</head>
<body>
  <div class="js-container"></div>
  <div class="js-container2"></div>
  <div class="js-container3"></div>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
  <script src="https://unpkg.com/supersimpledev/babel.js"></script>
  <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

  <script type="text/babel">
    const button = <button>Hello</button>;
    const button1a = <button>Good Job!</button>;
    const paragraph = <p>Hello this is a paragraph</p>;
    const myName = <h3>Ing. Edward Junior Sierra Castellón</h3>;
    const product = <h2>Cotton Socks</h2>;
    const productPrice = 10;
    const button2a = <button>Add to cart</button>;
    const shippingCost = 5;
    let productCost = 0;

    const products = [
      {
        id: 1,
        name: "Pack of Socks",
        price: 10
      },
      {
        id: 2,
        name: "T-Shirt",
        price: 8
      }
    ]

    const div = (
      <div>
        { button }
        { paragraph }  
      </div>
    );

    const exercise1a = (
      <div>
        { button1a }
        My name is { myName }
      </div>
    );

    const exercise1c = (
      <div>
        <ul>
          {products.map((product) => (
            <li 
              key={product.id}>
              {product.name} ${product.price}
              <button onClick={() => {
                productCost = productCost + product.price;
                console.log(productCost);
              }}>
                Add to Cart
              </button>
            </li>
          ))}
        </ul>
          <h2>Product Costs: ${productCost}</h2>
          <h2>Shipping Cost: ${shippingCost}</h2>
          <h2>Total Cost: ${shippingCost + productCost}</h2>
          <p>{dayjs().format('HH:mm:ss')}</p>
        </div>
    );

    const container = document.querySelector('.js-container');
    const container2 = document.querySelector('.js-container2');
    const container3 = document.querySelector('.js-container3');

    ReactDOM.createRoot(container).render(div);
    ReactDOM.createRoot(container2).render(exercise1a);
    ReactDOM.createRoot(container3).render(exercise1c);

    // puedo meter en render dentro de la funcion donde hago los calculos
    // debo separa las dependencias o las responsabilidades
    
  </script>
</body>
</html>
