<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React - Chat Bot</title>
</head>
<body>
  <div class="js-container"></div>
  <div class="js-container2"></div>
  <div class="js-container3"></div>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
  <script src="https://unpkg.com/supersimpledev/babel.js"></script>
  <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

  <script type="text/babel">
    function ChatInput () {
      return (
        <div>
          <input 
            id="input"
            placeholder="Send a message to ChatBot"
            size="40"
          />
          <button>Send</button>
        </div>
      );
    }

    function ChatMessage ({ message, sender }) {
      // const message = props.message;
      // const sender = props.sender;
      // const { message, sender } = props;
      /*
      if (sender === 'robot') {
        return (
          <div>
            <img src="robot.png" alt="user" width="50"/>
            {message}
          </div>
        );
      }
      */

      return (
        <div>
          {/*guard operator*/}
          {sender === 'robot' && <img src="robot.png" alt="user" width="50"/>}
          {message}
          {sender === 'user' && <img src="user.png" alt="user" width="50"/>}
        </div>
      );
    }

    function App (){
      return (
        <>
          <ChatMessage
            message="Hello Chat, I'm a Prop"
            sender="user"
          />
          <ChatMessage 
            message="Hello! How can I help you?" 
            sender="robot"
          />
          <ChatMessage 
            message="Can you get me todays date?" 
            sender="user"
          />
          <ChatMessage 
            message="Today is August 04" 
            sender="robot"
          />
        </>
      );
    }

    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App/>);

    // puedo meter en render dentro de la funcion donde hago los calculos
    // debo separa las dependencias o las responsabilidades
    
  </script>
</body>
